# Render Blueprint.
#   interviewai-ws      Socket.IO realtime server (free plan works).
#   interviewai-worker  Optional background worker for AI evaluations. Render
#                       background workers need a paid plan; without one, leave
#                       EVALUATION_MODE=auto on Vercel and evaluations run in
#                       the web app instead.
# The web app runs on Vercel. apps/code-executor needs a host with a Docker
# daemon and is NOT deployed here (see DEPLOYMENT.md).
services:
  - type: web
    name: interviewai-ws
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@9.0.0 && pnpm install --frozen-lockfile --prod=false --filter ws-server... && pnpm --filter ws-server run build
    startCommand: node --enable-source-maps apps/ws-server/dist/index.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/ws-server/**
        - packages/core/**
        - scripts/bundle.mjs
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      # Comma-separated list of allowed browser origins, no trailing slash.
      - key: CLIENT_URL
        value: https://interviewai-nine-theta.vercel.app
      # Secrets: entered in the Render dashboard, never committed.
      # Must be the SAME Redis instance used by the web app, executor and worker.
      - key: REDIS_URL
        sync: false
      # Must equal REALTIME_JWT_SECRET on Vercel.
      - key: REALTIME_JWT_SECRET
        sync: false

  - type: worker
    name: interviewai-worker
    runtime: node
    plan: starter
    buildCommand: npm install -g pnpm@9.0.0 && pnpm install --frozen-lockfile --prod=false --filter worker... && pnpm --filter worker run build
    startCommand: node --enable-source-maps apps/worker/dist/index.js
    buildFilter:
      paths:
        - apps/worker/**
        - packages/**
        - scripts/bundle.mjs
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
